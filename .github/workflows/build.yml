name: Smartphone Digivice build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: Creation version to publish
        required: true
        type: string
permissions:
  contents: read
jobs:
  frame:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ pkg-config libegl1-mesa-dev libgles2-mesa-dev libcairo2-dev libjson-c-dev libpipewire-0.3-dev libx11-dev libxtst-dev python3-cairo
      - uses: actions/checkout@v4
        with:
          repository: ValveSoftware/openvr
          ref: 0924064316de3effbcd1acf1e309182a2deb1c05
          path: vendor/openvr
      - run: ./build.sh
        env:
          OPENVR_LIB_DIR: ${{ github.workspace }}/vendor/openvr/bin/linuxarm64
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 -c 'import json,os; v=json.load(open("module.json"))["version"]; assert os.environ["GITHUB_REF_NAME"] == "v"+v, "Tag must match creation version"'
      - run: python3 tools/fetch_assets.py
      - run: python3 tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: smartphone-digivice-frame-package
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: frame
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: smartphone-digivice-frame-package
          path: dist
      - name: Publish Smartphone Digivice release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            TAG="v$REQUESTED_VERSION"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          python3 - "$TAG" <<'CHECK'
          import json,re,sys,pathlib
          tag=sys.argv[1]
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+',tag), 'Use a release version such as 0.2.6'
          meta=json.loads(pathlib.Path('dist/catalog.json').read_text())['modules'][0]
          assert tag == 'v'+meta['version'], 'Requested version must match the built creation'
          CHECK
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "Smartphone Digivice $TAG" --notes "Guided setup for MagicShelf on Steam Frame. Requires MagicShelf 0.3.8 or newer. Existing subscriptions and saved data are preserved."
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
